<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Are you new here?</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Container relativo para empilhar texto + imagem */
  .img-container {
    position: relative;
    display: inline-block;
  }

  /* Texto sempre presente — a imagem o cobre fisicamente quando no lugar */
  #behind-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0.5em;
    /* Estilo ARG — personalize conforme a fase */
    font-family: monospace;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    color: #c8a96e;
    text-align: center;
    white-space: pre-line;
  }

  /* A imagem fica acima, arrastável */
  #image {
    display: block;
    position: relative;   /* left/top do drag funcionam aqui */
    cursor: grab;
    user-select: none;
    -webkit-user-drag: none;
    transition: opacity 0.4s ease;
  }

  #image.grabbing {
    cursor: grabbing;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="number">1.</div>

  <!--
    O container posiciona o texto ATRÁS da imagem.
    Edite #behind-text no CSS ou o conteúdo abaixo.
  -->
  <div class="img-container" id="img-container">
    <p id="behind-text">password: undertherug
    </p>
    <img src="welcome.png" id="image" alt="Stage image" draggable="false">
  </div>

  <p id="text">Do you know where to look?</p>
  <button id="access">ACCESS</button>
</div>

<div id="login" class="hidden">
  <h2>AUTHENTICATION</h2>
  <input type="text" id="user" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button id="enter">ENTER</button>
  <p id="message"></p>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
